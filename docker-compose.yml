# Local PostgreSQL only. The FastAPI app connects as the restricted expense_app role
# created by backend setup, never as the superuser below.
# Host port 5433 avoids a PostgreSQL install already listening on 5432.

name: expense-tracker

services:
  db:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - expense_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  expense_pg_data:
